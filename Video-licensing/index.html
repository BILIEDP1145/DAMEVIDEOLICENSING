<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="https://www.zakoflare.com/CN/copyico.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒情盒里的蛋饺 视频授权信息查询 ZH-CN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>
            <svg class="header-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            视频授权查询
        </h1>
        <button id="themeToggle" class="theme-toggle">
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <span class="theme-text">深色模式</span>
        </button>
    </header>

    <main>
        <section class="search-container">
            <h2>按序列号查询</h2>
            <p>输入视频序列号（如 20260426114500bili）或授权人UID进行搜索</p>
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" id="searchInput" placeholder="输入序列号 (20260426114500bili) 或 UID...">
                <button id="searchButton">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    查询
                </button>
            </div>
        </section>

        <section class="results-section">
            <div class="results-header">
                <h2>查询结果</h2>
                <div id="resultCount" class="result-count">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    共 <span id="count">0</span> 条记录
                </div>
            </div>
            <div class="results-grid" id="resultsGrid">
                <!-- 初始状态提示 -->
                <div id="initialState" class="initial-state">
                    <svg class="state-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    <h3>输入序列号开始查询</h3>
                    <p>查询结果将以卡片形式在此处展示</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>盒情盒里的蛋饺 视频授权信息查询系统</p>
            <p class="footer-motto">copyright © ZAKOFLARE.COM | DAME.MILLENNIUMIC.CN</p>
            <p class="footer-subtitle">抵制未授权翻拍，恶意举报，盗用素材等行为</p>
            <p class="footer-subtitle">授权申请 dame@millenniumic.cn</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
